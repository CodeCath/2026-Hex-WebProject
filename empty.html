<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <title>部落格 - 文章</title> </head>
<body>
    
    <nav class="navbar bg-primary-50">
    <div class="container d-flex justify-between align-center">
        
        <a href="index.html" class="navbar__logo">
        <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/47001d42324ec6a2c7d00cc74ea79d70c57d578a/2026-web-camp/device-pc.svg" alt="Nelson Logo"> 
        </a>

        <button class="navbar__toggle" id="menu-toggle">
        <span class="material-symbols-outlined">dehaze</span>
        </button>

        <div class="navbar__collapse" id="navbar-collapse">
        <div class="navbar__overlay" id="menu-overlay"></div>
        
        <div class="navbar__menu-wrapper bg-primary-50">
            
            <div class="navbar__mobile-header d-flex justify-between align-center">
            <a href="index.html" class="navbar__logo">
                <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/47001d42324ec6a2c7d00cc74ea79d70c57d578a/2026-web-camp/device-mobile.svg" alt="Nelson Logo"> 
            </a>
            <button class="navbar__close" id="menu-close">
                <span class="material-symbols-outlined">close</span>
            </button>
            </div>

            <ul class="navbar__menu d-flex">
            <li><a href="#" class="navbar__link text-md text-neutral-700">服務項目</a></li>
            <li><a href="#" class="navbar__link text-md text-neutral-700">專案作品</a></li>
            <li><a href="blog.html" class="navbar__link text-md text-neutral-700">部落格</a></li>
            <li><a href="#" class="navbar__link text-md text-neutral-700">與我聯絡</a></li>
            </ul>

        </div>
        </div>

    </div>
    </nav>



    <section class="contact bg-primary-900 text-white">
    <div class="container">
        <div class="contact__inner">
      <div class="contact__text">
        <div class="contact__header mb-6">
          <p class="title-xxxs mb-2">與我聯絡</p>
          <h2 class="title-xxxl">CONTACT</h2>
        </div>
        <p class="text-md mb-6" style="line-height: 1.8;">
          若有數位產品設計和開發相關問題<br>
          歡迎填寫表單 或 直接與我聯絡！
        </p>
      </div>
      <form class="contact__form">
        <div class="form-row d-flex">
          <input class="form-input text-md" type="text" placeholder="姓名" required />
          <input class="form-input text-md" type="tel" placeholder="手機號碼" required />
        </div>
        <input class="form-input text-md" type="email" placeholder="電子信箱" required />
        <textarea class="form-textarea text-md" placeholder="備註"></textarea>
        <button type="submit" class="btn bg-neutral-0 text-neutral-700 title-xxxs submit-btn">送出</button>
      </form>
      <div class="contact__social-group">
        <div class="contact__socials d-flex align-center mb-4" style="gap: 12px;">
          <a href="#" class="social-icon"><i class="bi bi-instagram"></i></a>
          <a href="#" class="social-icon"><i class="bi bi-line"></i></a>
          <a href="#" class="social-icon"><i class="bi bi-linkedin"></i></a>
        </div>
        <div class="contact__email text-md d-flex align-center gap-2">
          <span class="material-symbols-outlined" style="font-size: 20px;">mail</span> 
          service@hexschool.com
        </div>
      </div>
    </div>
    </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <script>
    AOS.init({
        duration: 1500, // 動畫長度 1.5 秒
        once: true      
    });
    </script>

    <script src="all.js"></script>

</body>
</html>
